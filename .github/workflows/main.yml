name: reviewdog
on:
  pull_request:
      branches:
      - main
jobs:
  checkstyle:
    name: runner / checkstyle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: error
          checkstyle_config: ./mystyle.xml
